name: CI

# G17: the CI surface TESTING.md's coverage recipe was waiting for.
# Runs rubocop and the FULL suite (test:fast + test:slow — the slow file
# exclusion that hid the Plan 111 MCP fixture regression for two days is
# closed here), with simplecov coverage enabled and published as an artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: windows-latest
    env:
      # tree_sitter_language_pack publishes no Windows prebuilt (ruby platform
      # only) so the gem compiles via rb-sys/cargo. RubyInstaller Ruby is a
      # MinGW build: cargo must target the GNU ABI, not the runner's default
      # MSVC — mirrors the local dev setup (RUST_TARGET + mingw gcc).
      RUST_TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Rust GNU toolchain (RubyInstaller ABI)
        run: |
          rustup toolchain install stable-gnu --profile minimal --no-self-update
          rustup default stable-gnu
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          # bundler-cache is split out: BINDGEN_EXTRA_CLANG_ARGS must be
          # derived from the installed Ruby BEFORE tree_sitter_language_pack
          # compiles (see the export step).
      - name: Export bindgen include paths (msys2/ucrt64 headers)
        shell: bash
        run: |
          # rb-sys generates Ruby bindings via bindgen/libclang. The runner's
          # libclang defaults to MSVC headers (no strings.h); point it at the
          # Ruby devkit headers and the bundled msys2 ucrt64 headers instead.
          args="$(ruby -e 'c = RbConfig::CONFIG
            print "-target x86_64-pc-windows-gnu -I#{c["rubyarchhdrdir"]} -I#{c["rubyhdrdir"]} -I#{File.expand_path("msys64/ucrt64/include", c["prefix"])}"')"
          echo "BINDGEN_EXTRA_CLANG_ARGS=$args" >> "$GITHUB_ENV"
      - name: Bundle install
        run: bundle install --jobs 4
      - name: Rubocop
        run: bundle exec rubocop

  test:
    runs-on: windows-latest
    env:
      RUBIK_COVERAGE: "1"
      RUST_TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Rust GNU toolchain (RubyInstaller ABI)
        run: |
          rustup toolchain install stable-gnu --profile minimal --no-self-update
          rustup default stable-gnu
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          # bundler-cache split out for the bindgen include export (lint job).
      - name: Export bindgen include paths (msys2/ucrt64 headers)
        shell: bash
        run: |
          args="$(ruby -e 'c = RbConfig::CONFIG
            print "-target x86_64-pc-windows-gnu -I#{c["rubyarchhdrdir"]} -I#{c["rubyhdrdir"]} -I#{File.expand_path("msys64/ucrt64/include", c["prefix"])}"')"
          echo "BINDGEN_EXTRA_CLANG_ARGS=$args" >> "$GITHUB_ENV"
      - name: Bundle install
        run: bundle install --jobs 4
      # Full suite in two loaders: fast first (fails in ~2 min on the common
      # case), then the 16 measured-slow files that test:fast excludes. Each
      # step reports coverage under its own simplecov command name so the
      # final artifact merges all three suites instead of only the last.
      - name: Fast unit suite
        run: bundle exec rake test:fast
        env:
          RUBIK_COVERAGE_SUITE: fast
      - name: Slow unit suite
        run: bundle exec rake test:slow
        env:
          RUBIK_COVERAGE_SUITE: slow
      - name: Integration suite
        run: bundle exec rake test:integration
        env:
          RUBIK_COVERAGE_SUITE: integration
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # Gemspec floor gate (D1, plan gem-publication-2026-10-09): the README
  # claims Linux + Ruby 3.4, so the suite has to prove it. tree_sitter
  # ships an x86_64-linux prebuilt — no Rust toolchain step needed here.
  # Advisory context until proven stable; promote to a required check after.
  #
  # RUBIK_FIBER_SCHEDULER=off (the documented sequential escape hatch):
  # on Linux the suite's deliberate Net::OpenTimeout fixtures leave Net's
  # Timeout watchdogs firing into unrelated frames (run 38136180457 — the
  # progress reporter's $stdout write died of Net::OpenTimeout). Tracked
  # separately; re-enable the scheduler here once that fix lands.
  linux-test:
    runs-on: ubuntu-latest
    env:
      RUBIK_FIBER_SCHEDULER: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake

  # Publication smoke (plan S6): build the gem, install it into a clean
  # GEM_HOME with real dependency resolution, exercise the CLI entry point
  # and a bare require. Mirrors the local `rake build` + isolated install.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Build the gem
        run: bundle exec rake build
      - name: Clean-room install and smoke
        run: |
          export GEM_HOME="$RUNNER_TEMP/cleanroom"
          export PATH="$GEM_HOME/bin:$PATH"
          version="$(ruby -r./lib/rubik/version -e 'print Rubik::VERSION')"
          gem install "pkg/rubik-${version}.gem"
          rubik --version
          ruby -e 'require "rubik"; puts Rubik::VERSION'
