AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - ".git/**/*"
    - "_plan/**/*"
    - ".rubik/**/*"
    - "dev/**/*"

# Documentation
Style/Documentation:
  Enabled: false

# Repository convention is LF (see .gitattributes); working-tree CRLF
# produced by core.autocrlf must not surface as style offenses.
Layout/EndOfLine:
  EnforcedStyle: lf

# ENV["HOME"] || fallback is deliberate: Dir.home raises when HOME is unset
# (cron/service contexts on both Windows and Unix); nil-coalescing keeps
# those code paths functional.
Style/EnvHome:
  Enabled: false

# Command-style API methods legitimately return booleans without ending in ?
# (undo, rollback, update_file, register_command, verify_*!, deactivate!...).
# Forcing ? would break REPL command name matching and plugin contracts
# (Plan 53); 11 findings were all action-style methods, not predicates.
Naming/PredicateMethod:
  Enabled: false

# Intentional no-op callbacks/handlers in test doubles (registered commands,
# stream callbacks). Empty test bodies remain visible to review regardless.
Lint/EmptyBlock:
  Exclude:
    - "test/**/*"

# Fixture file name mirrors its gem name (kebab-case); renaming would break
# the plugin fixture loading contract.
Naming/FileName:
  Exclude:
    - "test/fixtures/plugins/**/*"

# Line length
Layout/LineLength:
  Max: 180
  AllowedPatterns:
    - '\A\s*#'

# Metrics
# Complexity metrics are enforced by the TEST SUITE instead of RuboCop:
# test_module_hygiene (file line caps), test_repl_command_decoupling
# (shell.rb < 600 lines) and the Plan 54/57/59/60 decomposition work own
# this concern. The remaining findings are intrinsic complexity of REPL
# command handlers, tool schemas, FFI drivers and multi-language
# extractors; refactoring them for metric counts is exactly the
# behavior-risk this cleanup plan (Plan 62) set out to avoid.
Metrics/BlockLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

# Style rules
Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets

Style/ClassAndModuleChildren:
  Enabled: false

Style/RescueStandardError:
  Enabled: false

Style/GlobalVars:
  Exclude:
    - "test/**/*"
    - "lib/rubik/repl/shell.rb"
