AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - ".git/**/*"
    - "_plan/**/*"
    - ".rubik/**/*"
    - "dev/**/*"

# Documentation
Style/Documentation:
  Enabled: false

# Repository convention is LF (see .gitattributes); working-tree CRLF
# produced by core.autocrlf must not surface as style offenses.
Layout/EndOfLine:
  EnforcedStyle: lf

# ENV["HOME"] || fallback is deliberate: Dir.home raises when HOME is unset
# (cron/service contexts on both Windows and Unix); nil-coalescing keeps
# those code paths functional.
Style/EnvHome:
  Enabled: false

# Line length
Layout/LineLength:
  Max: 160
  AllowedPatterns:
    - '\A\s*#'

# Metrics
Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "Rakefile"
    - "rubik.gemspec"

Metrics/MethodLength:
  Max: 60
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Max: 300
  Exclude:
    - "test/**/*"

Metrics/ModuleLength:
  Max: 300
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Max: 50
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Max: 15
  Exclude:
    - "test/**/*"

Metrics/PerceivedComplexity:
  Max: 15
  Exclude:
    - "test/**/*"

# post_json / post_stream_json expose explicit kwargs (headers, payload,
# timeouts...) as their public transport API; AST::Symbol's keyword-only
# constructor mirrors its serialized field set.
Metrics/ParameterLists:
  Exclude:
    - "lib/rubik/llm/client.rb"
    - "lib/rubik/ast/symbol.rb"

# Style rules
Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets

Style/ClassAndModuleChildren:
  Enabled: false

Style/RescueStandardError:
  Enabled: false

Style/GlobalVars:
  Exclude:
    - "test/**/*"
    - "lib/rubik/repl/shell.rb"
