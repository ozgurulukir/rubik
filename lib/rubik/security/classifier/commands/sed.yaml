# $schema: ../../../schemas/command.schema.json
command: sed
description: "Stream editor for filtering and transforming text"
classification: LOCAL_EFFECTS
strict: false
global_options:
  --help: {overrides: READONLY}
options:
  -i: {overrides: DANGEROUS, risk: HIGH}
  --in-place: {overrides: DANGEROUS, risk: HIGH, aliases: [-i]}
  -e: {takes_value: true}
  --expression: {takes_value: true, aliases: [-e]}
  -f: {overrides: DANGEROUS, risk: HIGH, takes_value: true}
  --file: {overrides: DANGEROUS, risk: HIGH, takes_value: true, aliases: [-f]}
