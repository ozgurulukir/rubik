# $schema: ../../../schemas/command.schema.json
command: cargo
description: "Rust package manager and build tool"
strict: false
global_options:
  --help: {overrides: READONLY}
  --version: {overrides: READONLY}
  -V: {overrides: READONLY}
  --list: {overrides: READONLY}
subcommands:
  build:
    classification: LOCAL_EFFECTS
    risk: LOW
    options:
      --workspace: {}
      --all: {}
      --release: {}
      --frozen: {}
      --locked: {}
      --offline: {}
  test:
    classification: LOCAL_EFFECTS
    risk: LOW
    options:
      --workspace: {}
      --all: {}
      --no-run: {}
      --no-fail-fast: {}
      --release: {}
      --frozen: {}
      --locked: {}
      --offline: {}
      --doc: {}
      --quiet: {}
  run:
    classification: DANGEROUS
  check:
    classification: READONLY
    options:
      --workspace: {}
      --all: {}
      --frozen: {}
      --locked: {}
      --offline: {}
  clippy:
    classification: READONLY
    options:
      --fix: {overrides: LOCAL_EFFECTS}
      --workspace: {}
      --all: {}
      --frozen: {}
      --locked: {}
      --offline: {}
  fmt:
    classification: LOCAL_EFFECTS
    risk: LOW
    options:
      --check: {overrides: READONLY}
      --all: {}
  doc:
    classification: LOCAL_EFFECTS
    risk: LOW
    options:
      --no-deps: {}
      --workspace: {}
  publish:
    classification: DANGEROUS
  install:
    classification: LOCAL_EFFECTS
    risk: LOW
    options:
      --list: {overrides: READONLY}
  clean:
    classification: LOCAL_EFFECTS
    risk: LOW
  update:
    classification: LOCAL_EFFECTS
    risk: LOW
  search:
    classification: READONLY
  tree:
    classification: READONLY
    options:
      --workspace: {}
      --all: {}
  metadata:
    classification: READONLY
    options:
      --no-deps: {}
  verify-project:
    classification: READONLY
  bench:
    classification: LOCAL_EFFECTS
    risk: LOW
  init:
    classification: LOCAL_EFFECTS
    risk: LOW
  new:
    classification: LOCAL_EFFECTS
    risk: LOW
  fix:
    classification: LOCAL_EFFECTS
    risk: LOW
    options:
      --allow-dirty: {}
  add:
    classification: LOCAL_EFFECTS
    risk: LOW
  remove:
    classification: LOCAL_EFFECTS
    risk: LOW
  generate-lockfile:
    classification: LOCAL_EFFECTS
    risk: LOW
